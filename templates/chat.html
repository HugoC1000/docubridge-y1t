<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ModelMind Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
</head>

<body>
  <div class="container my-5">
    <div class="card shadow-sm mx-auto chat-card" style="max-width: 820px;">
      <div class="card-body p-0 d-flex flex-column">
        <!-- Chat window -->
        <div id="chat-window" class="chat-window p-3"></div>

        <!-- Composer -->
        <form id="composer" class="chat-composer p-2 border-top" enctype="multipart/form-data">
          <input type="file" name="excel_file" id="excel_input" accept=".xls,.xlsx" hidden>
          <div class="d-flex align-items-center gap-2">
            <button type="button" id="attach-btn" class="btn btn-light border">Attach Excel</button>
            <div id="file-chip" class="file-chip d-none"></div>
            <input type="text" class="form-control" name="user_question" id="user_question" placeholder="Message ModelMind..." autocomplete="off" required>
            <button type="submit" id="send-btn" class="btn btn-primary">Send</button>
            <button type="button" id="reset-btn" class="btn btn-outline-secondary">New File</button>
          </div>
          <small class="text-muted d-block mt-1">Tip: First message needs an Excel file. After that, just ask away.</small>
        </form>
      </div>
    </div>
  </div>

  <script id="prefill-data" type="application/json" data-prefill="{{ prefill|e }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.9/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
